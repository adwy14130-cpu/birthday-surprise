<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدية عيد ميلاد ❤️</title>

<style>
body{
margin:0;
font-family:Tahoma;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
overflow:hidden;
}

.box{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
width:90%;
max-width:700px;
}

h1{
color:#e91e63;
font-size:42px;
}

p{
font-size:22px;
color:#555;
}

#countdown{
font-size:40px;
font-weight:bold;
color:#ff4081;
margin:30px;
}

iframe{
width:100%;
height:400px;
border:none;
border-radius:20px;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:12px;
background:#e91e63;
color:white;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#c2185b;
}
</style>
</head>

<body>

<div class="box">

<div id="before">

<h1>❤️ فيه مفاجأة مستنياك ❤️</h1>

<p>
كل ثانية بتقربك من هدية معمولة من كل قلبي...
</p>

<div id="countdown"></div>

</div>

<div id="after" style="display:none;">

<h1>🎉 كل سنة وأنت حبيبي ❤️</h1>

<p>
أتمنى الفيديو ده يفضل يفكرك قد إيه أنت غالي عندي.
</p>

<button onclick="window.open('https://drive.google.com/file/d/1oZI7XYPJ1ZP_3_FJDoxz3Y_neZA1fOk6/view','_blank')">
🎥 افتح الفيديو
</button>

</div>

</div>

<script>

const target=new Date("2026-08-15T00:00:00+03:00").getTime();

setInterval(function(){

const now=new Date().getTime();

const diff=target-now;

if(diff<=0){

document.getElementById("before").style.display="none";
document.getElementById("after").style.display="block";

}else{

let days=Math.floor(diff/(1000*60*60*24));
let hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let minutes=Math.floor((diff%(1000*60*60))/(1000*60));
let seconds=Math.floor((diff%(1000*60))/1000);

document.getElementById("countdown").innerHTML=
days+" يوم "
+hours+" ساعة "
+minutes+" دقيقة "
+seconds+" ثانية";

}

},1000);

</script>

</body>
</html>
