<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدية خاصة ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', Tahoma, sans-serif;
    overflow-x: hidden;
    background: linear-gradient(135deg, #1c0710 0%, #3a0f1d 45%, #20060c 100%);
    min-height: 100vh;
    color: white;
}

.hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.heart {
    position: absolute;
    bottom: -50px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    to { transform: translateY(-115vh); }
}

.container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px 90px;
    text-align: center;
}

.lead {
    font-size: clamp(18px, 3.5vw, 24px);
    color: rgba(255, 255, 255, 0.92);
    line-height: 1.8;
}

.days-number {
    font-family: 'Aref Ruqaa', serif;
    font-size: clamp(80px, 16vw, 150px);
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    margin: 5px 0;
    line-height: 1.2;
}

.love-button {
    display: inline-block;
    margin-top: 40px;
    padding: 16px 45px;
    font-size: 20px;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #20060c;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
    transition: all 0.3s ease;
    font-family: 'Cairo', sans-serif;
    text-decoration: none;
}

.love-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(255, 215, 0, 0.6);
}

.signature {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: rgba(255, 215, 0, 0.6);
    z-index: 100;
    text-align: center;
}

@media (max-width: 768px) {
    .container {
        padding: 30px 15px 90px;
    }
}
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="container">
    <p class="lead">عدّى </p>
    <div class="days-number" id="daysNumber">49</div>
    <p class="lead">يوم من أجمل لحظة في حياتي ❤️</p>
    <a class="love-button" href="message.html">💌 رساله مستخبيه ليك</a>
</div>

<div class="signature">
    Made with love❤️ by Rehab
</div>

<script>
function createHearts() {
    const wrap = document.getElementById('hearts');
    const emojis = ['❤️', '🤍', ''];
    
    for (let i = 0; i < 25; i++) {
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = Math.random() * 100 + '%';
        h.style.fontSize = (14 + Math.random() * 22) + 'px';
        h.style.opacity = (0.25 + Math.random() * 0.5).toString();
        h.style.animationDuration = (9 + Math.random() * 10) + 's';
        h.style.animationDelay = (-Math.random() * 15) + 's';
        wrap.appendChild(h);
    }
}

const baseDays = 49;
const anchorDate = new Date('2026-08-27T00:00:00');

function calcDays() {
    const now = new Date();
    return baseDays + Math.floor((now - anchorDate) / (1000 * 60 * 60 * 24));
}

window.addEventListener('DOMContentLoaded', () => {
    createHearts();
    document.getElementById('daysNumber').textContent = calcDays();
});
</script>

</body>
</html>
